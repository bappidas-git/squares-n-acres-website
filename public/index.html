<!doctype html>
<html lang="en-IN">
  <head>
    <!--
      `data-rh="true"` marks the tags `<Seo>` takes over once React has
      booted (prompt 38): react-helmet-async replaces every tag carrying that
      attribute rather than adding a second copy beside it. They are spelled
      out here so that the first paint, a crawler that runs no JavaScript and
      the prerendered build all have a title, a description and an icon.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#CF3F38" data-rh="true" />
    <meta name="application-name" content="Squares N Acres" data-rh="true" />
    <meta
      name="description"
      content="Squares N Acres helps you buy, sell and rent apartments, villas, plots and commercial spaces across Bengaluru. Verified listings, locality guides and expert assistance."
      data-rh="true"
    />
    <title>Squares N Acres – Buy, Sell &amp; Rent Properties in Bangalore</title>

    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/brand/favicon-32.png" data-rh="true" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/brand/favicon-16.png" data-rh="true" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/brand/favicon-48.png" data-rh="true" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/brand/apple-touch-icon.png" data-rh="true" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Three origins are on the critical path of the first paint: the two that
      serve the fonts, and the one that serves every picture on the site
      (§8.6). Opening the connections here costs nothing and saves the DNS
      lookup, the TCP handshake and the TLS negotiation at the moment the hero
      image is requested. `picsum.photos` — the seed photography — is
      deliberately not listed: it is not what production serves.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      A boot that throws leaves a white page and nothing else.

      `services/http.js` refuses to start without `REACT_APP_API_URL` (D48) —
      the right call, because a fallback URL would send a live site's traffic
      somewhere nobody chose. But that throw happens while the bundle's modules
      are still evaluating, before `createRoot`, so `ErrorBoundary` is not
      mounted yet and cannot catch it: a build made without the variable served
      a blank page whose only clue was a line in the console.

      This says so on the page instead. It listens before the bundle loads,
      writes nothing while the app boots normally, and only speaks up if the
      root is still empty when an uncaught error arrives — so a later runtime
      error, which `ErrorBoundary` does handle, never reaches it.
    -->
    <script>
      (function () {
        var shown = false;
        window.addEventListener('error', function (event) {
          var root = document.getElementById('root');
          if (shown || !root || root.childElementCount > 0) return;
          shown = true;
          var message =
            event && event.message
              ? String(event.message).replace(/^Uncaught\s+(Error:\s*)?/, '')
              : 'The application could not start.';
          root.setAttribute('role', 'alert');
          root.style.cssText =
            'margin:0 auto;padding:48px 16px;max-width:38rem;' +
            'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;' +
            'color:#1f1f1f;line-height:1.6;text-align:center';
          var heading = document.createElement('h1');
          heading.style.cssText = 'margin:0 0 12px;font-size:1.5rem';
          heading.textContent = 'This site is not configured yet';
          var detail = document.createElement('p');
          detail.style.cssText = 'margin:0;color:#5f6368';
          detail.textContent = message;
          root.appendChild(heading);
          root.appendChild(detail);
        });
      })();
    </script>
  </body>
</html>
